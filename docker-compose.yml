services:
  mysql8:
    image: mysql:8.0.32
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]
    volumes:
      - mysql8:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 3s
      timeout: 10s
      retries: 10

volumes:
  mysql8:
    driver_opts:
      type: tmpfs
      device: tmpfs